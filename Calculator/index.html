
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A responsive calculator built with HTML, CSS and JavaScript."
    >

    <title>CodeAlpha | Calculator</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="calculator-container">
        <header class="calculator-header">
            <div>
                <p class="eyebrow">CODEALPHA PROJECT</p>
                <h1>Calculator</h1>
            </div>

            <span class="calculator-icon" aria-hidden="true">⌗</span>
        </header>

        <section class="calculator" aria-label="Calculator">

            <div class="display-panel">
                <div
                    class="expression"
                    id="expression"
                    aria-label="Current expression"
                ></div>

                <output
                    class="display"
                    id="display"
                    aria-live="polite"
                    aria-atomic="true"
                >0</output>

                <p
                    class="display-status"
                    id="status"
                    aria-live="polite"
                >Ready</p>
            </div>

            <div class="button-grid" id="buttonGrid">

                <button class="btn function-btn"
                    type="button" data-action="clear">AC</button>

                <button class="btn function-btn"
                    type="button" data-action="delete">DEL</button>

                <button class="btn function-btn"
                    type="button" data-action="sign">+/-</button>

                <button class="btn operator-btn"
                    type="button" data-operator="/">÷</button>


                <button class="btn number-btn"
                    type="button" data-digit="7">7</button>

                <button class="btn number-btn"
                    type="button" data-digit="8">8</button>

                <button class="btn number-btn"
                    type="button" data-digit="9">9</button>

                <button class="btn operator-btn"
                    type="button" data-operator="*">×</button>


                <button class="btn number-btn"
                    type="button" data-digit="4">4</button>

                <button class="btn number-btn"
                    type="button" data-digit="5">5</button>

                <button class="btn number-btn"
                    type="button" data-digit="6">6</button>

                <button class="btn operator-btn"
                    type="button" data-operator="-">−</button>


                <button class="btn number-btn"
                    type="button" data-digit="1">1</button>

                <button class="btn number-btn"
                    type="button" data-digit="2">2</button>

                <button class="btn number-btn"
                    type="button" data-digit="3">3</button>

                <button class="btn operator-btn"
                    type="button" data-operator="+">+</button>


                <button class="btn number-btn zero-btn"
                    type="button" data-digit="0">0</button>

                <button class="btn number-btn"
                    type="button" data-action="decimal">.</button>

                <button class="btn equals-btn"
                    type="button" data-action="calculate">=</button>

            </div>

            <footer class="calculator-footer">
                <span>Built with HTML, CSS & JavaScript</span>
                <span>CodeAlpha</span>
            </footer>
        </section>
    </main>
</body>
</html>
